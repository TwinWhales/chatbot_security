[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forensicagent"
version = "0.0.1"
description = "Forensic auto-triage CLI agent — local LLM picks tools, runs them, extracts suspicious findings."
readme = "CLAUDE.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "forensicagent contributors" },
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "ollama>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
crawlers = ["beautifulsoup4>=4.12.0"]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
forensicagent = "forensicagent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["forensicagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
