tool_id: chainsaw
display_name: Chainsaw
version_supported: ">=2.0"

category: log_analysis
subcategory: windows_event_log

applicable_evidence_types:
  - evtx_log

platform:
  - windows
  - linux
  - macos

input_format:
  - ext:.evtx

output_format: jsonl
output_size_estimate: large
parallelizable: true
estimated_runtime: short

install_check:
  command: "chainsaw --version"
  expected_pattern: "chainsaw"

command_templates:
  - name: "Channel-aware Event ID search"
    template: "chainsaw search -t {channel_event_ids} --match-any --jsonl --output {output_dir}/chainsaw.jsonl {evidence_path}"
    when: |
      증거 EVTX의 채널에 맞는 주요 Event ID를 빠르게 확인할 때. 실제 실행은
      ChainsawAdapter(executor/chainsaw_adapter.py)가 담당한다. 증거 파일명으로
      채널을 판별한 뒤 `Event.System.EventID: =<id>` Tau 표현식을 만들고,
      여러 식은 `--match-any`로 결합해 EventID 필드만 정확히 비교한다.

usage_description: |
  Chainsaw로 Windows EVTX를 빠르게 파싱하고, 파일명에서 추정한
  채널별 주요 Event ID를 Tau 필드 질의로 정확히 검색한다. 출력
  JSON의 EventID, TimeCreated, EventData를 구조화된 규칙으로 분석한다.

suspicious_indicators:
  - id: rdp_logon_external_ip
    pattern: "EventID 4624 + LogonType=10 (RemoteInteractive) + IpAddress 가 RFC1918 외부"
    severity_baseline: high
    description: "외부 IP 에서의 RDP 로그온 성공"
  - id: rdp_logon_offhours
    pattern: "EventID 4624 + LogonType 10 + 설정된 조직 현지 업무시간 밖"
    severity_baseline: medium
    description: "설정된 UTC offset과 업무시간 밖의 RDP 로그온; 단독 확정 신호 아님"
  - id: brute_force_followed_by_success
    pattern: "동일 source_ip 에서 EventID 4625 (실패) 다수 후 4624 (성공)"
    severity_baseline: high
    description: "Brute force 가 성공으로 끝난 경우"
  - id: failed_logon_burst
    pattern: "EventID 4625 (실패) 가 동일 source_ip 또는 동일 target_username 으로 10건 이상"
    severity_baseline: medium
    description: "5분 내 반복 실패 후보. 후속 4624 성공 여부를 별도로 확인한다."
  - id: account_creation_4720
    pattern: "EventID 4720 (계정 생성) + 곧이어 4732 (privileged group 추가)"
    severity_baseline: high
    description: "공격자가 backdoor 계정 생성 후 권한 부여하는 전형 패턴"
  - id: clear_log_event
    pattern: "EventID 1102 (Security log cleared) 또는 104 (System log cleared)"
    severity_baseline: critical
    description: "공격자 흔적 제거 시도. 항상 critical."
  - id: powershell_encoded_command
    pattern: "EventID 4104 ScriptBlockText 에 -EncodedCommand 또는 base64 블롭"
    severity_baseline: high
    description: "인코딩된 PowerShell 명령은 회피 패턴"
  - id: service_install_4697
    pattern: "EventID 4697 ServiceFileName 또는 7045 ImagePath가 사용자 쓰기 가능 경로인 경우"
    severity_baseline: high
    description: "사용자 쓰기 가능 경로에서 신규 서비스 실행"

known_false_positives:
  - "관리자가 PowerShell 로 정상 작업 (서명된 스크립트 / known admin)"
  - "도메인 컨트롤러의 정상 머신 계정 로그온"

reference_urls:
  - https://github.com/WithSecureLabs/chainsaw
