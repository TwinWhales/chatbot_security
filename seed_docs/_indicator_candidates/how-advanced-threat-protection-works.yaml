topic: Advanced Threat Protection and Detection Techniques
indicators:
- id: suspicious_process_behavior
  pattern: Process with unusual parent-child relationship detected.
  severity_baseline: medium
  description: Identifies potential supply chain attack behavior.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: unusual_volume_shadow_copy_deletion
  pattern: Volume shadow copy deletion command detected on a workstation.
  severity_baseline: high
  description: Indicates pre-encryption activity by ransomware.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: lateral_movement_detection
  pattern: Service account performing unexpected lateral movement detected.
  severity_baseline: medium
  description: Detects potential adversary activity within the network.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: mitre_attck_t1195_002
  pattern: Behavior mapped to MITRE ATT&CK T1195.002 (Compromise Software Supply Chain).
  severity_baseline: high
  description: Identifies a known supply chain attack pattern.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: automated_quarantine_response
  pattern: Automatically quarantined endpoint with forensic artifacts attached.
  severity_baseline: high
  description: Rapid response to detected threats.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ransomware_pre_encryption_indicators
  pattern: Unusual volume shadow copy deletion commands on a workstation.
  severity_baseline: high
  description: Detects ransomware activity before encryption.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: backups_scanned_for_malware
  pattern: Backup snapshots scanned for malware and IOCs using real-time threat intelligence.
  severity_baseline: medium
  description: Ensures backup data is free from threats.
  tool_hint: plaso (timeline)
  applicable_evidence_types:
  - disk_image
- id: honeytokens_detected
  pattern: Honeypot or honeytoken activity detected in the network.
  severity_baseline: medium
  description: Indicates potential adversary presence and activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/how-advanced-threat-protection-works/
source_title: 'Advanced Threat Protection: A Guide for SOC Analysts'
