topic: Advanced SOC Threat Hunting Techniques
indicators:
- id: aws-assume-role-suspicious
  pattern: Unusual AWS STS AssumeRole API calls from unexpected IP addresses or at odd times.
  severity_baseline: low
  description: Detects potential unauthorized access attempts via AWS STS AssumeRole API.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: azure-service-principal-suspicious
  pattern: Service principals accessing resources outside their normal pattern, especially to production databases by CI/CD
    service principals.
  severity_baseline: low
  description: Identifies suspicious access patterns for Azure service principals.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: gcp-service-account-key-creation
  pattern: Service account key creation events, focusing on high-privilege accounts in GCP Audit Logs.
  severity_baseline: low
  description: Detects potential persistence mechanisms via service account keys in GCP.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: kubernetes-privilege-escalation
  pattern: RoleBinding changes that grant elevated permissions in Kubernetes audit logs.
  severity_baseline: low
  description: Identifies potential privilege escalation attempts in Kubernetes environments.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: metadata-service-abuse
  pattern: Unusual access to cloud metadata services from compute instances, such as 169.254.169.254.
  severity_baseline: low
  description: Detects potential credential theft attempts via cloud metadata service abuse.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: public-storage-exposure
  pattern: Correlation of publicly accessible storage buckets with unusual access patterns.
  severity_baseline: low
  description: Identifies potential data exfiltration attempts via public storage exposure.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/soc-threat-hunting/
source_title: Master SOC Threat Hunting Techniques | CyberDefenders Blog
