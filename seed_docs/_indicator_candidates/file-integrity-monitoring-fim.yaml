topic: File Integrity Monitoring (FIM)
indicators:
- id: file-content-change
  pattern: Hash mismatch detected for critical file
  severity_baseline: medium
  description: Indicates potential unauthorized modification of a system or application binary.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - disk_image
- id: permission-change
  pattern: Unexpected permission change on critical file or directory
  severity_baseline: low
  description: Detects changes in file permissions that could indicate unauthorized access.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - disk_image
- id: file-creation-deletion
  pattern: New executable or script created in unexpected location
  severity_baseline: medium
  description: Identifies the creation of new executables or scripts that may be malicious.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - disk_image
- id: system-binary-replacement
  pattern: System binary replaced with trojanised version
  severity_baseline: high
  description: Detects the replacement of a system binary that could be used for persistence.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - disk_image
- id: cron-job-modification
  pattern: Cron job or scheduled task modified for persistence
  severity_baseline: medium
  description: Identifies modifications to cron jobs that could be used by attackers.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - disk_image
- id: registry-change
  pattern: Registry modification used for persistence or privilege escalation
  severity_baseline: medium
  description: Detects changes in the Windows registry that could be used by attackers.
  tool_hint: regripper
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: log-file-deletion
  pattern: Log file or security tool component deleted to cover tracks
  severity_baseline: medium
  description: Identifies the deletion of log files that could be used for hiding malicious activities.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - disk_image
- id: size-change
  pattern: Unexpected size change in critical file or directory
  severity_baseline: low
  description: Detects modifications to the content of a file that could be malicious.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - disk_image
source_url: https://cyberdefenders.org/blog/file-integrity-monitoring-fim/
source_title: What is File Integrity Monitoring(FIM)?
