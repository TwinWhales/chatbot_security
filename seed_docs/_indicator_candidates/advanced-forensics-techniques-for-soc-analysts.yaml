topic: Advanced Memory and Disk Forensic Techniques for SOC Analysts
indicators:
- id: memory_pslist_suspicious_process
  pattern: Process listed by windows.pslist with unusual command-line arguments or parent-child relationships.
  severity_baseline: low
  description: Identifies suspicious processes running in memory.
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: disk_image_sha256_hash_mismatch
  pattern: SHA256 hash of the disk image does not match expected or baseline value.
  severity_baseline: medium
  description: Detects potential tampering with the disk image.
  tool_hint: FTK Imager, dd
  applicable_evidence_types:
  - disk_image
- id: registry_hive_deleted_key
  pattern: Deleted key in SYSTEM or NTUSER.DAT hive with suspicious last written time.
  severity_baseline: low
  description: Indicates potential persistence mechanism used by an attacker.
  tool_hint: regripper
  applicable_evidence_types:
  - registry_hive
- id: eventlog_security_log_suspicious_login
  pattern: Event ID 4624 in Security log with unusual user or source IP address.
  severity_baseline: low
  description: Detects unauthorized access attempts.
  tool_hint: Autopsy, Sleuth Kit
  applicable_evidence_types:
  - evtx_log
- id: prefetch_file_suspicious_execution
  pattern: Prefetch file with unusual execution count or last run time.
  severity_baseline: low
  description: Identifies potentially malicious executables run from disk.
  tool_hint: Autopsy, Sleuth Kit
  applicable_evidence_types:
  - prefetch
- id: network_traffic_suspicious_outbound_connection
  pattern: Outbound network connection in memory or disk image to suspicious IP address.
  severity_baseline: medium
  description: Indicates potential data exfiltration or command-and-control communication.
  tool_hint: volatility, tshark
  applicable_evidence_types:
  - memory_dump
  - pcap
- id: amcache_deleted_executable
  pattern: Executable listed in AmCache with last modified time before its deletion.
  severity_baseline: low
  description: Detects deleted executables that may have been used by an attacker.
  tool_hint: X-Ways, EnCase
  applicable_evidence_types:
  - amcache
- id: lnk_file_suspicious_target
  pattern: LNK file with suspicious target path or last modified time.
  severity_baseline: low
  description: Identifies potentially malicious shortcuts created by an attacker.
  tool_hint: Autopsy, Sleuth Kit
  applicable_evidence_types:
  - lnk_file
source_url: https://cyberdefenders.org/blog/advanced-forensics-techniques-for-soc-analysts/
source_title: Explore advanced Forensics Techniques for SOC
