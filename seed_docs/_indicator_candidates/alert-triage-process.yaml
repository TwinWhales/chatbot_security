topic: Alert Triage Process for SOC Analysts
indicators:
- id: alert-ingestion
  pattern: An alert from any security tool (EDR, NDR, firewall, etc.) is ingested into a centralized SIEM system.
  severity_baseline: info
  description: Ensure all alerts are captured in one place for triage.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: alert-categorization
  pattern: An alert is categorized according to a threat framework like MITRE ATT&CK.
  severity_baseline: info
  description: Classify alerts by type of threat behavior for efficient triage.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: alert-prioritization
  pattern: An alert is prioritized based on asset criticality, attack stage, threat intelligence match, and anomaly score.
  severity_baseline: info
  description: Determine the urgency of an alert for immediate action.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: investigation-evidence-gathering
  pattern: Gather log data, endpoint telemetry, network traffic, and historical context to evaluate an alert.
  severity_baseline: info
  description: Collect evidence to determine if the alert is a true positive or false positive.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: true-false-positive-determination
  pattern: An alert is determined to be a true positive, false positive, or unclear.
  severity_baseline: info
  description: Conclude whether the alert represents malicious activity or benign behavior.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: escalation-incident-response
  pattern: Escalate a true positive alert to incident response for further investigation and containment.
  severity_baseline: info
  description: Transition confirmed alerts into the incident response workflow.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: documentation-continuous-improvement
  pattern: Document the triage process and use it to continuously improve detection rules and workflows.
  severity_baseline: info
  description: Maintain records for future reference and rule tuning.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
source_url: https://cyberdefenders.org/blog/alert-triage-process/
source_title: What Is the Alert Triage Process? SOC Guide [2026]
