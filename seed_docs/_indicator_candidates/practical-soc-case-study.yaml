topic: Detecting Malicious File Downloads from Browser Telemetry
indicators:
- id: process_creation_events
  pattern: Process creation events (Event ID 4688 or Sysmon Event ID 1) with chrome.exe → invoice_march2025.exe parent-child
    relationships.
  severity_baseline: low
  description: Identify if a downloaded file was executed after being downloaded by the browser.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: malicious_process_tree
  pattern: Spawning of scripting engines (powershell.exe, cmd.exe) or rapid child process chaining.
  severity_baseline: medium
  description: Detect potential malware staging or downloader behavior by analyzing the process tree.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: file_hash_reputation
  pattern: Detection ratio in VirusTotal or similar platforms, known malware family classification, and behavioral tags such
    as 'downloader', 'trojan', or 'dropper'.
  severity_baseline: low
  description: Check the reputation of a file by querying threat intelligence services.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: network_activity_investigation
  pattern: Connections to newly registered domains or unusual geographic destinations, encrypted traffic to unknown endpoints.
  severity_baseline: medium
  description: Identify command-and-control (C2) communication or payload retrieval by analyzing network activity.
  tool_hint: tshark (pcap)
  applicable_evidence_types:
  - pcap
- id: persistence_mechanism_detection
  pattern: Registry run keys, scheduled tasks, startup folder modifications.
  severity_baseline: high
  description: Detect if the malware established persistence mechanisms to maintain access.
  tool_hint: regripper (registry)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: lateral_movement_and_impact_assessment
  pattern: Credential harvesting, contact with other systems internally, evidence of privilege escalation.
  severity_baseline: high
  description: Assess the impact by checking for lateral movement and credential harvesting activities.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/practical-soc-case-study/
source_title: 'SOC Simulator: Investigate Malware Download Alerts'
