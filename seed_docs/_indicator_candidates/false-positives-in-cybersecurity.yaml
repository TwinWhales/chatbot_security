topic: False Positives in Cybersecurity
indicators:
- id: overly_sensitive_detection_rule
  pattern: Security tool flags routine software update as malware due to overly sensitive threat signatures.
  severity_baseline: low
  description: Detection rule is too aggressive, flagging normal activity as suspicious.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: incomplete_signatures
  pattern: Detection rule based on incomplete signatures flags benign network traffic as malicious.
  severity_baseline: low
  description: Signatures are too generic, leading to false positives.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: lack_of_context
  pattern: Security tool generates alert without considering asset criticality or user roles, leading to false positive.
  severity_baseline: low
  description: Contextual data is missing in the detection process.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: environmental_changes
  pattern: Software update triggers unexpected alert due to changes in network topology or system configuration.
  severity_baseline: low
  description: Detection rules fail to account for environmental changes.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: misconfigured_tools
  pattern: Incorrectly set up SIEM or endpoint protection system generates unnecessary alerts.
  severity_baseline: low
  description: Security tools are misconfigured, leading to false positives.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: rule_tuning
  pattern: Regularly review and adjust detection rules based on typical network activity.
  severity_baseline: info
  description: Adjusting thresholds to better fit normal behavior reduces false positives.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: baseline_normal_activity
  pattern: Establish a baseline of normal system activity for anomaly detection.
  severity_baseline: info
  description: Understanding typical behavior helps in identifying true positives.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: contextual_enrichment
  pattern: Enhance alerts with contextual data to prioritize investigations and filter noise.
  severity_baseline: info
  description: Adding context helps in distinguishing between false positives and true positives.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/false-positives-in-cybersecurity/
source_title: False positives in cybersecurity | CyberDefenders Blog
