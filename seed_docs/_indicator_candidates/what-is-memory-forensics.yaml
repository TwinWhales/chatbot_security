topic: Memory Forensic Indicators for SOC Analysts
indicators:
- id: memory_dump_process_list
  pattern: List of running processes and their parent-child relationships
  severity_baseline: low
  description: Detects masquerading, injection, and unauthorized execution
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: memory_dump_network_connections
  pattern: Active and recent network connections in memory
  severity_baseline: low
  description: Identifies C2 channels, lateral movement, and data exfiltration
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: memory_dump_injected_code_dll_anomalies
  pattern: Code loaded in memory but absent from disk
  severity_baseline: medium
  description: Reveals fileless malware, reflective loading, and process hollowing
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: memory_dump_credentials_tokens
  pattern: NTLM hashes, Kerberos tickets, session tokens in memory
  severity_baseline: high
  description: Exposes credential theft and lateral movement enablers
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: memory_dump_clipboard_user_input
  pattern: Recently copied data, typed strings in clipboard and user input
  severity_baseline: low
  description: Provides attacker behavior context and exfiltration evidence
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: memory_dump_kernel_structures
  pattern: DKOM manipulation, hidden drivers, rootkit activity in kernel structures
  severity_baseline: high
  description: Detects advanced persistence and privilege escalation
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: memory_dump_hidden_processes
  pattern: Processes running from non-standard directories
  severity_baseline: medium
  description: Flags processes running from non-standard directories for further investigation
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
- id: memory_dump_executable_memory_regions
  pattern: Executable memory regions not backed by an on-disk file
  severity_baseline: high
  description: Detects executable memory regions for potential malware or injected code
  tool_hint: volatility
  applicable_evidence_types:
  - memory_dump
source_url: https://cyberdefenders.org/blog/what-is-memory-forensics/
source_title: How Does Memory Forensics Work? | CyberDefenders Blog
