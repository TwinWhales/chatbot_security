topic: DevSecOps Practices and Security Automation
indicators:
- id: sast_scan_results
  pattern: Static application security testing (SAST) scan results indicating potential vulnerabilities in code commits.
  severity_baseline: low
  description: Identifies coding patterns that could lead to security issues early in the development cycle.
  tool_hint: yara (signatures)
  applicable_evidence_types:
  - memory_dump
  - text_log
- id: dependency_vulnerabilities
  pattern: Software composition analysis (SCA) tool reports of known vulnerabilities in third-party dependencies.
  severity_baseline: low
  description: Detects insecure or outdated libraries and packages that could be exploited.
  tool_hint: yara (signatures)
  applicable_evidence_types:
  - memory_dump
  - text_log
- id: secret_detection
  pattern: Secret detection tools like Gitleaks or Trufflehog identifying hardcoded secrets in code repositories.
  severity_baseline: low
  description: Finds credentials and API keys that are exposed in source control, posing a risk of unauthorized access.
  tool_hint: yara (signatures)
  applicable_evidence_types:
  - memory_dump
  - text_log
- id: container_image_vulnerabilities
  pattern: Container security tools like Trivy or Grype reporting vulnerabilities in container images before deployment.
  severity_baseline: low
  description: Scans container images for known vulnerabilities to prevent insecure deployments.
  tool_hint: yara (signatures)
  applicable_evidence_types:
  - memory_dump
  - text_log
- id: iaca_misconfigurations
  pattern: Infrastructure as code (IaC) security tools like Checkov or tfsec flagging misconfigurations in cloud infrastructure
    templates.
  severity_baseline: low
  description: Detects insecure configurations that could lead to breaches, such as open S3 buckets or overly permissive IAM
    roles.
  tool_hint: yara (signatures)
  applicable_evidence_types:
  - memory_dump
  - text_log
- id: cspm_compliance_violations
  pattern: Cloud security posture management (CSPM) tools like Wiz or Prisma Cloud identifying non-compliant configurations
    in cloud environments.
  severity_baseline: low
  description: Monitors and enforces compliance policies across cloud resources to ensure they meet organizational standards.
  tool_hint: plaso (timeline)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: runtime_threat_detection
  pattern: Runtime threat detection tools like Falco or Microsoft Sentinel detecting suspicious activities in production environments.
  severity_baseline: low
  description: Monitors and alerts on potential threats that could compromise the application or infrastructure during runtime.
  tool_hint: plaso (timeline)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/what-is-devsecops-in-cybersecurity/
source_title: What Is DevSecOps & How Does It Work? | CyberDefenders Blog
