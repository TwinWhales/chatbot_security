topic: USB Device Alert Investigation
indicators:
- id: usb_device_insertion
  pattern: Device insertion event with unknown VID/PID
  severity_baseline: low
  description: Indicates an unauthorized device was inserted.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: bulk_file_write
  pattern: 100+ files written to removable media in under 5 minutes
  severity_baseline: medium
  description: Suggests potential data exfiltration activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: process_execution_drive_path
  pattern: Process execution from removable drive path
  severity_baseline: high
  description: Indicates potential malware delivery via USB.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: hr_flagged_user
  pattern: User flagged for HR action or on PIP
  severity_baseline: medium
  description: Increases the risk of insider threat.
  tool_hint: other (HR systems)
  applicable_evidence_types:
  - unknown
- id: off_hours_insertion
  pattern: Device insertion at 2-5 AM with no other user activity
  severity_baseline: medium
  description: Suspicious behavior indicating potential insider threat.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: compressed_archive_creation
  pattern: Compressed archive created within 60 seconds before device insertion
  severity_baseline: medium
  description: Suggests preparation for data exfiltration.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: hid_emulation_device
  pattern: HID emulation device signature detected (e.g., VID 0x03EB / PID 0x2401)
  severity_baseline: high
  description: Indicates potential use of a Rubber Ducky or similar device.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: sensitive_file_transfer
  pattern: Sensitive file types (.pst, .db, .sql) transferred via USB
  severity_baseline: high
  description: High risk of data exfiltration.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
source_url: https://cyberdefenders.org/blog/soc-training-usb-device-alert-investigation/
source_title: SOC Simulator: USB Insider Threat Detection
