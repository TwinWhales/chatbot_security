topic: Reducing SOC Alert Fatigue
indicators:
- id: generic-threat-model-mismatch
  pattern: Detection rules that do not align with the organization's specific environment or risk tolerance.
  severity_baseline: low
  description: Generic threat models may trigger alerts for normal business operations.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: high-volume-low-value-rules
  pattern: High volume, low value rules generating numerous false positives.
  severity_baseline: low
  description: Rules that generate alerts for normal business operations or authorized administrative activities.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: alert-correlation-missing
  pattern: Lack of automated alert correlation and grouping.
  severity_baseline: low
  description: Discrete alerts without context or related events are not clustered into unified incidents.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: inadequate-context-in-alerts
  pattern: Low-context alerts without necessary information for rapid decision-making.
  severity_baseline: low
  description: Alerts that lack context such as asset criticality, user privilege level, or historical incident matching.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: tool-sprawl-and-siloed-data
  pattern: Fragmentation of data across multiple security tools without effective integration.
  severity_baseline: low
  description: Disparate consoles and lack of unified investigation interfaces leading to context-switching.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
- id: insufficient-staffing-levels
  pattern: Understaffed SOCs relative to alert volume and complexity.
  severity_baseline: low
  description: Overworked analysts leading to burnout and reduced performance.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
  - browser_artifact
  - prefetch
  - text_log
source_url: https://cyberdefenders.org/blog/soc-alert-fatigue/
source_title: How to Reduce Security Alert Fatigue? | CyberDefenders Blog
