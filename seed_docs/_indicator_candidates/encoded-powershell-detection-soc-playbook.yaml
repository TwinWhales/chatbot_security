topic: Encoded PowerShell Command Detection
indicators:
- id: encoded-powershell-command
  pattern: -enc|EncodedCommand
  severity_baseline: low
  description: Detects the use of -enc or EncodedCommand flag in PowerShell commands.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: suspicious-parent-process-chain
  pattern: (winword.exe|excel.exe|mshta.exe|chrome.exe|outlook.exe) → powershell.exe -enc
  severity_baseline: high
  description: Identifies suspicious parent process chains associated with encoded PowerShell commands.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: remote-stager-download
  pattern: IEX \(New-Object Net.WebClient\).DownloadString\('http://.*?/payload'
  severity_baseline: high
  description: Detects remote stagers that download and execute payloads in memory.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: amsi-bypass-indicator
  pattern: \[Ref\].Assembly\.GetType|amsiUtils|amsiContext|AmsiScanBuffer|null-byte injection
  severity_baseline: high
  description: Identifies attempts to bypass AMSI (Anti-Malware Scan Interface) in the decoded payload.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: network-beaconing-patterns
  pattern: regular-interval connections at consistent byte sizes
  severity_baseline: medium
  description: Detects network beaconing patterns indicative of C2 communication.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: multi-layer-encoding
  pattern: \[System\.Convert\]::FromBase64String|New-Object IO\.MemoryStream
  severity_baseline: high
  description: Detects multi-layer encoding, which is strongly correlated with malicious activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: critical-flag-combinations
  pattern: (powershell\.exe -w hidden -nop -ep bypass -enc|powershell\.exe -version 2 -nop -w hidden -enc)
  severity_baseline: high
  description: Identifies critical flag combinations that are strong indicators of malicious intent.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: decoded-payload-red-flags
  pattern: (IEX \(New-Object Net.WebClient\).DownloadString|ReflectivePEInjection)
  severity_baseline: high
  description: Detects suspicious decoded payload behaviors that indicate malicious intent.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/encoded-powershell-detection-soc-playbook/
source_title: 'Encoded PowerShell Detection: SOC Playbook'
