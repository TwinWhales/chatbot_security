topic: Firewall Configuration and IDS/IPS Detection Techniques
indicators:
- id: suspicious_powershell_usage
  pattern: alert tcp any any -> any 5985 (msg:"Suspicious PowerShell Remoting Detected"; content:"/wsman"; nocase; sid:1000001;
    rev:1;)
  severity_baseline: low
  description: Detects suspicious PowerShell remoting activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: failed_firewall_connections_followed_by_ids_alerts
  pattern: Failed firewall connections followed by IDS alerts may indicate reconnaissance.
  severity_baseline: medium
  description: Correlates failed firewall connections with IDS alerts to identify potential reconnaissance activities.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: repeated_ids_detections_from_single_source
  pattern: Repeated IDS detections from a single source can trigger firewall blocks (dynamic blacklisting).
  severity_baseline: medium
  description: Detects repeated IDS alerts from the same source to trigger dynamic blocking.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: lateral_movement_detection
  pattern: e.g., SMB, RDP, WinRM traffic between workstations
  severity_baseline: low
  description: Detects lateral movement using common protocols.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: beaconing_to_c2_servers
  pattern: e.g., periodic, low-volume connections to C2 servers
  severity_baseline: medium
  description: Detects beaconing behavior indicative of command-and-control activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: unusual_protocol_usage_or_port_scanning
  pattern: Unusual protocol usage or port scanning detected by IDS/IPS
  severity_baseline: low
  description: Detects unusual network activity that may indicate malicious behavior.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: baseline_analysis_deviation
  pattern: Identify deviations from normal traffic patterns
  severity_baseline: low
  description: Detects anomalies in network behavior by comparing against a baseline.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: machine_learning_outliers
  pattern: Use statistical models to flag outliers (requires tuning to avoid noise)
  severity_baseline: low
  description: Detects unusual network behavior using machine learning techniques.
  tool_hint: other
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/firewall-configuration-for-soc-analyst/
source_title: What is the Firewall configuration techniques?
