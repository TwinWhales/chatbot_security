topic: Detecting Botnets
indicators:
- id: botnet-beaconing
  pattern: Repeated, timed outbound connections at regular intervals to the same unfamiliar IP address.
  severity_baseline: low
  description: Indicates potential C2 communication from a botnet.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - evtx_log
- id: unusual-slowness
  pattern: Unusual slowness in device performance, especially when idle.
  severity_baseline: low
  description: May indicate background processes running by a botnet.
  tool_hint: eztools (windows artifacts)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: high-cpu-usage
  pattern: High CPU or RAM usage even when idle or running simple applications.
  severity_baseline: low
  description: Suggests background processes that could be part of a botnet.
  tool_hint: eztools (windows artifacts)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: strange-outbound-connections
  pattern: Strange outbound connections to unfamiliar IP addresses or foreign servers at unexpected hours, especially late
    at night.
  severity_baseline: low
  description: Potential sign of C2 communication from a botnet.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - evtx_log
- id: unexplained-crashes-reboots
  pattern: Unexplained crashes, reboots, or instability in the device.
  severity_baseline: low
  description: Could be due to background processes running by a botnet.
  tool_hint: eztools (windows artifacts)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: unfamiliar-processes
  pattern: Unfamiliar processes running in the background, visible in Task Manager or Activity Monitor.
  severity_baseline: low
  description: May indicate malicious activity by a botnet.
  tool_hint: eztools (windows artifacts)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: router-behavior-strange
  pattern: Router behaving strangely, with slow speeds, unexpected reboots, and unfamiliar connected devices.
  severity_baseline: low
  description: Potential sign of a botnet spreading through the network.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - evtx_log
- id: unexplained-dns-requests
  pattern: Unexplained DNS requests or traffic to known malicious domains.
  severity_baseline: low
  description: Indicates potential C2 communication from a botnet.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - evtx_log
source_url: https://cyberdefenders.org/blog/botnet-attacks/
source_title: What Is a Botnet and How Does It Work? | CyberDefenders Blog
