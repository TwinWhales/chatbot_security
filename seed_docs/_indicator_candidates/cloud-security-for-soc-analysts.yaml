topic: Cloud Security for SOC Analysts
indicators:
- id: aws-api-call-anomaly
  pattern: Unusual API calls from AWS services or unexpected IP addresses.
  severity_baseline: low
  description: Detects potential account hijacking or unauthorized access.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
  - evtx_log
- id: iam-policy-change
  pattern: Unexpected changes in IAM policies or permissions.
  severity_baseline: medium
  description: Identifies potential privilege escalation attempts.
  tool_hint: regripper (registry)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: s3-bucket-misconfig
  pattern: Misconfigured S3 buckets with public access or data leakage.
  severity_baseline: low
  description: Detects potential data exfiltration from misconfigured storage.
  tool_hint: plaso (timeline)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
- id: cloudtrail-login-failure
  pattern: Failed login attempts or suspicious authentication events in CloudTrail logs.
  severity_baseline: low
  description: Monitors for potential insider threats or brute force attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: guardduty-suspicious-activity
  pattern: Suspicious activities detected by AWS GuardDuty, such as unusual network traffic or data access patterns.
  severity_baseline: medium
  description: Identifies potential threats using cloud-native security tools.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: vpc-flow-log-anomaly
  pattern: Anomalies in VPC Flow Logs indicating unusual network traffic patterns.
  severity_baseline: low
  description: Detects potential lateral movement or data exfiltration attempts.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: azure-ad-signin-anomaly
  pattern: Unusual Azure AD sign-in events, such as failed logins or unexpected locations.
  severity_baseline: low
  description: Monitors for potential insider threats or unauthorized access attempts.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: gcp-audit-log-misuse
  pattern: Suspicious activities in GCP Audit Logs, such as unauthorized API calls or data access.
  severity_baseline: medium
  description: Identifies potential misuse of cloud resources.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/cloud-security-for-soc-analysts/
source_title: What is Cloud Security in cybersecurity?
