topic: Threat Intelligence for SOC Analysts
indicators:
- id: ioc-matching
  pattern: Suspicious IP address or domain name matching known threat intelligence feeds.
  severity_baseline: low
  description: Enriches alerts with context such as malware family, threat actor, or campaign.
  tool_hint: evtx (events), plaso (timeline)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
  - disk_image
- id: malware-analysis
  pattern: Malware hash or signature detected in system memory or disk image.
  severity_baseline: medium
  description: Identifies malicious activity that may not trigger traditional alerts.
  tool_hint: volatility (memory), eztools (windows artifacts)
  applicable_evidence_types:
  - memory_dump
  - disk_image
- id: phishing-email-analysis
  pattern: Email content or metadata matching known phishing templates or indicators.
  severity_baseline: low
  description: Detects phishing attempts using threat intelligence.
  tool_hint: tshark (pcap), yara (signatures)
  applicable_evidence_types:
  - email
  - pcap
- id: c2-activity-hunting
  pattern: Network traffic or logs showing communication with known C2 infrastructure.
  severity_baseline: medium
  description: Hunts for malicious activity using TTPs and IOCs.
  tool_hint: evtx (events), tshark (pcap)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
  - pcap
- id: malicious-account-activity
  pattern: Login attempts or commands from known malicious IP addresses or domains.
  severity_baseline: low
  description: Detects suspicious activity based on threat intelligence feeds.
  tool_hint: evtx (events), plaso (timeline)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - registry_hive
- id: malware-code-similarity
  pattern: Malware code or behavior similar to known threats.
  severity_baseline: medium
  description: Identifies malware based on code similarities and TTPs.
  tool_hint: volatility (memory), eztools (windows artifacts)
  applicable_evidence_types:
  - memory_dump
  - disk_image
- id: phishing-link-analysis
  pattern: URL or link in email or document matching known phishing domains.
  severity_baseline: low
  description: Detects phishing attempts using threat intelligence.
  tool_hint: tshark (pcap), yara (signatures)
  applicable_evidence_types:
  - email
  - document
- id: command-line-activity-analysis
  pattern: Command-line activity or scripts matching known malicious behaviors.
  severity_baseline: medium
  description: Detects hidden threats using threat intelligence and TTPs.
  tool_hint: eztools (windows artifacts), yara (signatures)
  applicable_evidence_types:
  - memory_dump
  - disk_image
source_url: https://cyberdefenders.org/blog/threat-intelligence-for-soc-analysts/
source_title: Why Should SOC Analysts Master Threat Intelligence?
