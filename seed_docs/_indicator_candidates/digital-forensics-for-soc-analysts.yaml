topic: Disk and Memory Forensics for SOC Analysts
indicators:
- id: deleted_files
  pattern: Deleted files from NTFS file system
  severity_baseline: low
  description: Recovered deleted files to identify data exfiltration or unauthorized access.
  tool_hint: autopsy-sleuthkit
  applicable_evidence_types:
  - disk_image
- id: injected_dlls
  pattern: Injected DLLs in memory using Volatility
  severity_baseline: medium
  description: Identifies processes with injected code to detect fileless malware.
  tool_hint: volatility-framework
  applicable_evidence_types:
  - memory_dump
- id: network_connections
  pattern: Active network connections in memory using Volatility
  severity_baseline: low
  description: Detects active network connections to identify C2 communications.
  tool_hint: volatility-framework
  applicable_evidence_types:
  - memory_dump
- id: malware_yara_rule
  pattern: Malware detected using YARA rule in memory dump
  severity_baseline: medium
  description: Uses YARA rules to detect malware in memory.
  tool_hint: volatility-framework
  applicable_evidence_types:
  - memory_dump
- id: registry_hives
  pattern: Deleted registry hives from Windows Registry
  severity_baseline: low
  description: Recovering deleted registry hives to understand attacker actions.
  tool_hint: autopsy-sleuthkit
  applicable_evidence_types:
  - disk_image
- id: pcap_traffic
  pattern: Unusual network traffic patterns in PCAP files
  severity_baseline: low
  description: Identifies suspicious network activity using packet capture.
  tool_hint: wireshark
  applicable_evidence_types:
  - pcap
- id: suspicious_process
  pattern: Suspicious process running in memory using Volatility
  severity_baseline: medium
  description: Detects processes that may be malicious or indicative of an attack.
  tool_hint: volatility-framework
  applicable_evidence_types:
  - memory_dump
- id: deleted_browser_history
  pattern: Deleted browser history from disk image
  severity_baseline: low
  description: Recovering deleted browser history to understand attacker actions.
  tool_hint: autopsy-sleuthkit
  applicable_evidence_types:
  - disk_image
source_url: https://cyberdefenders.org/blog/digital-forensics-for-soc-analysts/
source_title: What Is Digital Forensics for SOC Analysts?
