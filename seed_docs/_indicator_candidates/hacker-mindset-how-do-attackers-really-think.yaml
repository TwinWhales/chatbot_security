topic: Predictable Attack Patterns and SOC Detection
indicators:
- id: repeated_dns_lookups
  pattern: Repeated DNS lookups for non-existent subdomains within a short time frame.
  severity_baseline: low
  description: Indicates potential reconnaissance activity by an attacker.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: rapid_port_scanning
  pattern: Rapid sequential port scanning from a single external IP address.
  severity_baseline: low
  description: Suggests an attacker is performing reconnaissance on the network.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: robots_txt_requests
  pattern: Multiple requests to /robots.txt, .git/, wp-admin/ or .env in a short window.
  severity_baseline: low
  description: May indicate an attacker is probing for information about the target's infrastructure.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: certificate_transparency_monitoring
  pattern: Certificate transparency monitoring showing newly registered lookalike domains targeting your organization.
  severity_baseline: low
  description: Suggests an attacker is preparing for a potential phishing or domain hijacking attack.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: low_and_slow_password_spray
  pattern: Low-and-slow password spray patterns with 1-2 attempts per account, spread across hours.
  severity_baseline: medium
  description: Indicates an attacker is attempting to brute force credentials without triggering immediate alerts.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: authentication_attempts_disabled_accounts
  pattern: Authentication attempts against disabled or service accounts.
  severity_baseline: medium
  description: May indicate an attacker is probing for access to less monitored accounts.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: sudden_mfa_push_notifications
  pattern: Sudden spike in MFA push notifications to a single user.
  severity_baseline: medium
  description: Could indicate an attacker is attempting to bypass multi-factor authentication.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
- id: valid_credentials_unusual_ip
  pattern: Use of valid credentials from an unusual geographic IP without prior travel pattern.
  severity_baseline: medium
  description: Suggests an attacker is using stolen or compromised credentials in a new location.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - evtx_log
source_url: https://cyberdefenders.org/blog/hacker-mindset-how-do-attackers-really-think/
source_title: 'Hacker Mindset: How Do Attackers Really Think?'
