    source_post: what-are-insider-threats
    conflict_with_existing_id: false
  - id: repeated-failed-access
    pattern: Repeated failed access to restricted resources (e.g., probing systems without permission).
    severity_baseline: low
    description: Probing for unauthorized access may indicate insider threat activity.
    tool_hint: evtx
    applicable_evidence_types: &id024
    - evtx_log
