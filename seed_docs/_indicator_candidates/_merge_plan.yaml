  candidates_with_target: 40
  candidates_without_target: 375
  duplicate_ids:
  - id: lateral_movement_detection
    sources:
    - firewall-configuration-for-soc-analyst
    - how-advanced-threat-protection-works
  - id: unusual_process_creation
    sources:
    - malware-analysis-for-soc-analysts
    - start-your-career-as-a-soc-analyst
  - id: file_modifications
    sources:
    - malware-analysis-for-soc-analysts
    - what-is-endpoint-security-for-soc-analysts
  - id: unauthorized_registry_modifications
    sources:
    - start-your-career-as-a-soc-analyst
    - top-8-soc-analyst-tools
  - id: lateral_movement
    sources:
    - what-is-access-control
    - what-is-endpoint-security-for-soc-analysts
by_target_tool:
  chainsaw:
  - id: ad-privileged-group-change
    pattern: Changes to privileged group memberships (e.g., Domain Admins, Enterprise Admins)
    severity_baseline: medium
    description: Detects unauthorized changes to high-privilege user groups.
    tool_hint: evtx
    applicable_evidence_types: &id001
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: ad-unusual-logon-pattern
    pattern: Unusual logon patterns (e.g., repeated failed login attempts, logins from unexpected locations)
    severity_baseline: low
    description: Identifies potential credential misuse or lateral movement.
    tool_hint: evtx
    applicable_evidence_types: &id002
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: ad-privilege-escalation-attempt
    pattern: Attempts to modify domain password policies or trust relationships between domains
    severity_baseline: high
    description: Detects potential privilege escalation attempts.
    tool_hint: evtx
    applicable_evidence_types: &id003
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: ad-service-account-abuse
    pattern: Service accounts authenticating from unexpected hosts or at unusual times
    severity_baseline: medium
    description: Detects potential insider threats or unauthorized access.
    tool_hint: evtx
    applicable_evidence_types: &id004
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: ad-dormant-account-activity
    pattern: Dormant accounts suddenly becoming active
    severity_baseline: medium
    description: Identifies potential insider threats or compromised accounts.
    tool_hint: evtx
    applicable_evidence_types: &id005
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: ad-kerberos-ticket-abuse
    pattern: Abnormal Kerberos ticket lifetimes or usage patterns
    severity_baseline: medium
    description: Detects potential credential abuse.
    tool_hint: evtx
    applicable_evidence_types: &id006
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: ad-privileged-account-creation
    pattern: Creation of new privileged accounts (e.g., Domain Admin, Enterprise Admin)
    severity_baseline: high
    description: Detects potential insider threats or unauthorized access.
    tool_hint: evtx
    applicable_evidence_types: &id007
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: ad-account-password-reset
    pattern: Mass password resets, especially during off-hours
    severity_baseline: medium
    description: Detects potential insider threats or compromised accounts.
    tool_hint: evtx
    applicable_evidence_types: &id008
    - evtx_log
    source_post: active-directory-monitoring
    conflict_with_existing_id: false
  - id: brute_force_detection
    pattern: Failed logon attempts with high volume and velocity (EventID 4625)
    severity_baseline: low
    description: Identifies potential brute force or password spray attacks.
    tool_hint: evtx
    applicable_evidence_types: &id009
    - authentication_log
    source_post: credential-theft-detection-hunting-for-soc-analysts
    conflict_with_existing_id: false
  - id: ntlm_in_kerberos_env
    pattern: NTLM validation (EventID 4776) from workstations in Kerberos-enforced domains
    severity_baseline: medium
    description: Flags potential Pass-the-Hash activity.
    tool_hint: evtx
    applicable_evidence_types: &id010
    - authentication_log
    source_post: credential-theft-detection-hunting-for-soc-analysts
    conflict_with_existing_id: false
  - id: rapid_multi_host_auth
    pattern: Single account authenticating to 5+ distinct hosts within a 10-minute window
    severity_baseline: high
    description: Indicates potential credential theft-driven lateral movement.
    tool_hint: evtx
    applicable_evidence_types: &id011
    - authentication_log
    source_post: credential-theft-detection-hunting-for-soc-analysts
    conflict_with_existing_id: false
  - id: kerberos_ticket_anomalies
    pattern: Kerberos ticket anomalies (abnormal lifespans, non-standard encryption types, or reference accounts that do not
      exist in AD)
    severity_baseline: high
    description: Detects potential Golden and Silver Ticket attacks.
    tool_hint: evtx
    applicable_evidence_types: &id012
    - authentication_log
    source_post: credential-theft-detection-hunting-for-soc-analysts
    conflict_with_existing_id: false
  - id: interactive_logon_server
    pattern: Interactive logons (Type 2) on servers that users never physically access
    severity_baseline: high
    description: Indicates potential post-compromise movement.
    tool_hint: evtx
    applicable_evidence_types: &id013
    - authentication_log
    source_post: credential-theft-detection-hunting-for-soc-analysts
    conflict_with_existing_id: false
  - id: network_logon_non_admin
    pattern: Network logons (Type 3) to domain controllers from non-admin workstations
    severity_baseline: high
    description: Detects potential credential abuse.
    tool_hint: evtx
    applicable_evidence_types: &id014
    - authentication_log
    source_post: credential-theft-detection-hunting-for-soc-analysts
    conflict_with_existing_id: false
  - id: unusual_service_account_usage
    pattern: Unusual interactive use of service accounts (T1078)
    severity_baseline: high
    description: Flags potential credential abuse by service accounts.
    tool_hint: evtx
    applicable_evidence_types: &id015
    - authentication_log
    source_post: credential-theft-detection-hunting-for-soc-analysts
    conflict_with_existing_id: false
  - id: telnet_usage
    pattern: Traffic involving Telnet protocol.
    severity_baseline: low
    description: Identifies unencrypted management protocols in use.
    tool_hint: evtx
    applicable_evidence_types: &id016
    - flow_data
    - pcap
    source_post: the-ultimate-guide-to-network-traffic-analysis-for-soc-analysts
    conflict_with_existing_id: false
  - id: http_usage
    pattern: Traffic involving HTTP protocol on port 80.
    severity_baseline: low
    description: Detects unencrypted web traffic.
    tool_hint: evtx
    applicable_evidence_types: &id017
    - flow_data
    - pcap
    source_post: the-ultimate-guide-to-network-traffic-analysis-for-soc-analysts
    conflict_with_existing_id: false
  - id: snmpv1_usage
    pattern: Traffic involving SNMPv1 protocol on port 161/162.
    severity_baseline: low
    description: Identifies unencrypted network management protocol in use.
    tool_hint: evtx
    applicable_evidence_types: &id018
    - flow_data
    - pcap
    source_post: the-ultimate-guide-to-network-traffic-analysis-for-soc-analysts
    conflict_with_existing_id: false
  - id: smb_lateral_movement
    pattern: New peer-to-peer SMB connections between internal hosts, especially involving privileged accounts.
    severity_baseline: medium
    description: Surfaces potential lateral movement by attackers.
    tool_hint: evtx
    applicable_evidence_types: &id019
    - flow_data
    - pcap
    source_post: the-ultimate-guide-to-network-traffic-analysis-for-soc-analysts
    conflict_with_existing_id: false
  - id: ransomware_scanning
    pattern: SMBv1 port 445 open and subsequent large-scale file-write patterns.
    severity_baseline: high
    description: Detects initial scanning behavior by ransomware variants.
    tool_hint: evtx
    applicable_evidence_types: &id020
    - flow_data
    - pcap
    source_post: the-ultimate-guide-to-network-traffic-analysis-for-soc-analysts
    conflict_with_existing_id: false
  - id: unusual-login-times
    pattern: Authentication events at unusual times (e.g., 2:00 AM) from standard business users.
    severity_baseline: low
    description: Unusual login times may indicate insider threat activity.
    tool_hint: evtx
    applicable_evidence_types: &id021
    - evtx_log
    source_post: what-are-insider-threats
    conflict_with_existing_id: false
  - id: access-outside-job-role
    pattern: Access to restricted resources outside the user's job role (e.g., HR salary tables by a marketing coordinator).
    severity_baseline: low
    description: Accessing data outside one’s job role may indicate insider threat activity.
    tool_hint: evtx
    applicable_evidence_types: &id022
    - evtx_log
    source_post: what-are-insider-threats
    conflict_with_existing_id: false
  - id: rapid-privilege-escalation
    pattern: Rapid privilege escalation without a corresponding change ticket or approval chain.
    severity_baseline: high
    description: Rapid privilege escalation may indicate insider threat activity.
    tool_hint: evtx
    applicable_evidence_types: &id023
