topic: Detection of Advanced Persistent Threats (APT) Indicators
indicators:
- id: initial_access_email
  pattern: Email gateway logs with suspicious attachments or links from unknown senders
  severity_baseline: low
  description: Detects potential initial access via spear-phishing emails.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - email_log
- id: persistence_scheduled_tasks
  pattern: New scheduled tasks in the registry or startup folders
  severity_baseline: medium
  description: Detects methods used to ensure continued access.
  tool_hint: regripper (registry)
  applicable_evidence_types:
  - registry_hive
- id: privilege_escalation_kerberos_anomalies
  pattern: Kerberos ticket anomalies or new local admin accounts created
  severity_baseline: medium
  description: Detects attempts to elevate privileges.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - event_log
- id: lateral_movement_unusual_auth_patterns
  pattern: Unusual authentication patterns or SMB/RDP connections from non-admin endpoints
  severity_baseline: medium
  description: Detects lateral movement within the network.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - event_log
- id: data_exfiltration_unusual_outbound_traffic
  pattern: Unusual outbound traffic volumes, DNS query anomalies, or access to sensitive file shares outside business hours
  severity_baseline: high
  description: Detects data exfiltration attempts.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - event_log
- id: web_shell_deployed_on_web_server
  pattern: Web shells deployed on compromised web servers
  severity_baseline: medium
  description: Detects persistence mechanisms.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - registry_hive
  - event_log
- id: psexec_execution_by_non_admin_user
  pattern: Admin tools like PsExec, WMIC, or net.exe executed by non-admin users
  severity_baseline: medium
  description: Detects privilege escalation attempts.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - event_log
- id: cleared_security_event_log
  pattern: Cleared Security Event Log entries (Event ID 1102)
  severity_baseline: high
  description: Detects attempts to cover tracks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - event_log
source_url: https://cyberdefenders.org/blog/advanced-persistence-threats/
source_title: 'APT Attacks Explained: SOC Detection Guide 2026'
