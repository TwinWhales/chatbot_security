topic: Detecting Credential Theft
indicators:
- id: brute_force_detection
  pattern: Failed logon attempts with high volume and velocity (EventID 4625)
  severity_baseline: low
  description: Identifies potential brute force or password spray attacks.
  tool_hint: evtx
  applicable_evidence_types:
  - authentication_log
- id: lsass_access_detection
  pattern: Process accessing LSASS memory (EventID 10 with GrantedAccess containing '0x1410', '0x1010', or '0x1438')
  severity_baseline: medium
  description: Detects potential credential dumping activities.
  tool_hint: sysmon
  applicable_evidence_types:
  - memory_dump
- id: ntlm_in_kerberos_env
  pattern: NTLM validation (EventID 4776) from workstations in Kerberos-enforced domains
  severity_baseline: medium
  description: Flags potential Pass-the-Hash activity.
  tool_hint: evtx
  applicable_evidence_types:
  - authentication_log
- id: rapid_multi_host_auth
  pattern: Single account authenticating to 5+ distinct hosts within a 10-minute window
  severity_baseline: high
  description: Indicates potential credential theft-driven lateral movement.
  tool_hint: evtx
  applicable_evidence_types:
  - authentication_log
- id: kerberos_ticket_anomalies
  pattern: Kerberos ticket anomalies (abnormal lifespans, non-standard encryption types, or reference accounts that do not
    exist in AD)
  severity_baseline: high
  description: Detects potential Golden and Silver Ticket attacks.
  tool_hint: evtx
  applicable_evidence_types:
  - authentication_log
- id: interactive_logon_server
  pattern: Interactive logons (Type 2) on servers that users never physically access
  severity_baseline: high
  description: Indicates potential post-compromise movement.
  tool_hint: evtx
  applicable_evidence_types:
  - authentication_log
- id: network_logon_non_admin
  pattern: Network logons (Type 3) to domain controllers from non-admin workstations
  severity_baseline: high
  description: Detects potential credential abuse.
  tool_hint: evtx
  applicable_evidence_types:
  - authentication_log
- id: unusual_service_account_usage
  pattern: Unusual interactive use of service accounts (T1078)
  severity_baseline: high
  description: Flags potential credential abuse by service accounts.
  tool_hint: evtx
  applicable_evidence_types:
  - authentication_log
source_url: https://cyberdefenders.org/blog/credential-theft-detection-hunting-for-soc-analysts/
source_title: 'Credential Theft: Detection Strategies for SOC Analysts'
