topic: DDoS Attack Detection
indicators:
- id: ddos-udp-flood
  pattern: Sustained UDP packet traffic with random destination ports.
  severity_baseline: medium
  description: Identifies potential UDP flood attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ddos-syn-flood
  pattern: Abnormal SYN-to-ACK ratio with high number of incomplete TCP handshakes.
  severity_baseline: medium
  description: Detects potential SYN flood attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ddos-http-get-flood
  pattern: Elevated HTTP GET requests per second to a specific endpoint.
  severity_baseline: medium
  description: Identifies potential HTTP GET flood attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ddos-icmp-flood
  pattern: High ICMP packet traffic with unusual source IPs.
  severity_baseline: low
  description: Detects potential ICMP flood attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ddos-dns-amplification
  pattern: Large volume of DNS queries with spoofed source IPs.
  severity_baseline: medium
  description: Identifies potential DNS amplification attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ddos-isp-bandwidth-alerts
  pattern: Bandwidth saturation alerts from ISP or CDN.
  severity_baseline: high
  description: Indicates potential volumetric DDoS attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ddos-slowloris
  pattern: High number of partial HTTP connections with no corresponding ACKs.
  severity_baseline: medium
  description: Detects potential Slowloris attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: ddos-http-5xx-errors
  pattern: Spike in HTTP 5xx error responses without corresponding user activity.
  severity_baseline: medium
  description: Identifies potential application-layer DDoS attacks.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/what-is-ddos-distributed-denial-of-service/
source_title: What is Distributed Denial of Service (DDoS)?
