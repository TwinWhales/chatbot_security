topic: Indicators of Insider Threat Activity
indicators:
- id: unusual-login-times
  pattern: Authentication events at unusual times (e.g., 2:00 AM) from standard business users.
  severity_baseline: low
  description: Unusual login times may indicate insider threat activity.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: large-data-transfers
  pattern: Large or abnormal data transfers (e.g., 4GB upload) from users outside their job role.
  severity_baseline: medium
  description: Large data transfers by unauthorized users may indicate insider threat activity.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - disk_image
- id: access-outside-job-role
  pattern: Access to restricted resources outside the user's job role (e.g., HR salary tables by a marketing coordinator).
  severity_baseline: low
  description: Accessing data outside one’s job role may indicate insider threat activity.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: rapid-privilege-escalation
  pattern: Rapid privilege escalation without a corresponding change ticket or approval chain.
  severity_baseline: high
  description: Rapid privilege escalation may indicate insider threat activity.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: mass-file-downloads
  pattern: Bulk file downloads shortly before a known resignation or contract end date.
  severity_baseline: medium
  description: Mass file downloads near an employee’s departure may indicate insider threat activity.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - disk_image
- id: repeated-failed-access
  pattern: Repeated failed access to restricted resources (e.g., probing systems without permission).
  severity_baseline: low
  description: Probing for unauthorized access may indicate insider threat activity.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: usb-activity
  pattern: Unexpected USB or removable media connections in sensitive environments.
  severity_baseline: low
  description: Unexpected device connections may indicate insider threat activity.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: large-outbound-transfers
  pattern: Large outbound transfers to non-corporate domains from standard business users.
  severity_baseline: medium
  description: Outbound data transfers may indicate insider threat activity.
  tool_hint: plaso
  applicable_evidence_types:
  - memory_dump
  - disk_image
source_url: https://cyberdefenders.org/blog/what-are-insider-threats/
source_title: What Are Insider Threats? | CyberDefenders Blog
