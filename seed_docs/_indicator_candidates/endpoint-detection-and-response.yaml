topic: Endpoint Detection and Response (EDR)
indicators:
- id: process_creation
  pattern: Process creation with unusual parent-child relationships or unexpected command-line arguments.
  severity_baseline: low
  description: Detects suspicious process creation patterns.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: file_modification
  pattern: Unusual file modifications or deletions, especially in system directories.
  severity_baseline: low
  description: Identifies suspicious file activity.
  tool_hint: eztools (windows artifacts)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: network_connection
  pattern: Unexpected network connections to known malicious IPs or domains.
  severity_baseline: low
  description: Detects unauthorized network activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: registry_modification
  pattern: Unusual registry key modifications or deletions, especially in critical system keys.
  severity_baseline: low
  description: Identifies suspicious changes to the Windows Registry.
  tool_hint: regripper (registry)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: powershell_usage
  pattern: PowerShell usage with unusual or obfuscated commands, especially in system directories.
  severity_baseline: low
  description: Detects potential fileless malware activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: user_authentication
  pattern: Unusual user logon or authentication events, especially from unknown locations or times.
  severity_baseline: low
  description: Identifies suspicious user activity.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: process_injection
  pattern: Process injection or memory access attempts, especially in critical system processes.
  severity_baseline: low
  description: Detects potential malicious activity.
  tool_hint: volatility (memory)
  applicable_evidence_types:
  - memory_dump
- id: removable_media_usage
  pattern: Unusual usage of removable media, especially in system directories or by unauthorized users.
  severity_baseline: low
  description: Identifies suspicious use of external storage devices.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/endpoint-detection-and-response/
source_title: Endpoint Detection and Response (EDR) | CyberDefenders Blog
