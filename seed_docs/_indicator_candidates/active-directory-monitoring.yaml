topic: Active Directory Monitoring for SOC Analysts
indicators:
- id: ad-privileged-group-change
  pattern: Changes to privileged group memberships (e.g., Domain Admins, Enterprise Admins)
  severity_baseline: medium
  description: Detects unauthorized changes to high-privilege user groups.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: ad-unusual-logon-pattern
  pattern: Unusual logon patterns (e.g., repeated failed login attempts, logins from unexpected locations)
  severity_baseline: low
  description: Identifies potential credential misuse or lateral movement.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: ad-privilege-escalation-attempt
  pattern: Attempts to modify domain password policies or trust relationships between domains
  severity_baseline: high
  description: Detects potential privilege escalation attempts.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: ad-service-account-abuse
  pattern: Service accounts authenticating from unexpected hosts or at unusual times
  severity_baseline: medium
  description: Detects potential insider threats or unauthorized access.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: ad-dormant-account-activity
  pattern: Dormant accounts suddenly becoming active
  severity_baseline: medium
  description: Identifies potential insider threats or compromised accounts.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: ad-kerberos-ticket-abuse
  pattern: Abnormal Kerberos ticket lifetimes or usage patterns
  severity_baseline: medium
  description: Detects potential credential abuse.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: ad-privileged-account-creation
  pattern: Creation of new privileged accounts (e.g., Domain Admin, Enterprise Admin)
  severity_baseline: high
  description: Detects potential insider threats or unauthorized access.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
- id: ad-account-password-reset
  pattern: Mass password resets, especially during off-hours
  severity_baseline: medium
  description: Detects potential insider threats or compromised accounts.
  tool_hint: evtx
  applicable_evidence_types:
  - evtx_log
source_url: https://cyberdefenders.org/blog/active-directory-monitoring/
source_title: What Is Active Directory Monitoring for SOC Analysts?
