topic: SOC Analyst Tools Overview
indicators:
- id: suspicious_login_attempts
  pattern: Multiple failed login attempts from the same IP address within a short timeframe.
  severity_baseline: low
  description: Detects potential brute force attacks.
  tool_hint: SIEM (log aggregation)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
  - text_log
- id: unusual_file_modifications
  pattern: Unexpected changes to system or application files outside of known maintenance windows.
  severity_baseline: low
  description: Indicates possible malware activity.
  tool_hint: SIEM (log aggregation)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: suspicious_network_activity
  pattern: Unusual network traffic patterns, such as high volume of data transfer or connections to known malicious IPs.
  severity_baseline: low
  description: Detects potential exfiltration attempts or command and control communications.
  tool_hint: NDR (network detection and response)
  applicable_evidence_types:
  - pcap
  - evtx_log
- id: unauthorized_registry_modifications
  pattern: Registry keys or values modified by non-administrative users or processes.
  severity_baseline: low
  description: Indicates potential privilege escalation attempts.
  tool_hint: RegRipper (registry analysis)
  applicable_evidence_types:
  - registry_hive
- id: abnormal_process_creation
  pattern: Creation of processes with unusual parent-child relationships or unexpected command lines.
  severity_baseline: low
  description: Detects potential malware or malicious activity.
  tool_hint: Volatility (memory analysis)
  applicable_evidence_types:
  - memory_dump
- id: unusual_browser_activity
  pattern: Browser history or cache modified by non-browser processes or at unusual times.
  severity_baseline: low
  description: Indicates potential insider threats or malicious activity.
  tool_hint: Browser (browser artifacts)
  applicable_evidence_types:
  - browser_artifact
- id: suspicious_email_activity
  pattern: Emails sent from internal users to external addresses with unusual content or attachments.
  severity_baseline: low
  description: Detects potential data exfiltration attempts.
  tool_hint: SOAR (security orchestration, automation and response)
  applicable_evidence_types:
  - email
- id: unusual_api_calls
  pattern: API calls made to external services or APIs that are not part of normal application behavior.
  severity_baseline: low
  description: Indicates potential data exfiltration or lateral movement.
  tool_hint: SIEM (log aggregation)
  applicable_evidence_types:
  - evtx_log
  - text_log
source_url: https://cyberdefenders.org/blog/Top-8-soc-analyst-tools/
source_title: 'SOC Analyst Tools: Complete Guide 2026 | CyberDefenders Blog'
