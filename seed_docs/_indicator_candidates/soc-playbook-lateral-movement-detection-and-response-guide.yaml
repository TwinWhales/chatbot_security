topic: Lateral Movement Detection
indicators:
- id: event-4688-process-creation
  pattern: Process creation with net.exe, nltest, dsquery, or adfind.exe within a 60-second window.
  severity_baseline: low
  description: Indicates system probing commands executed suspiciously quickly.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: event-5156-network-connections
  pattern: Multiple network connections to internal IPs on port 445 within a short period.
  severity_baseline: low
  description: Detects SMB scans from suspicious sources.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: event-4624-type3-logon
  pattern: Multiple Type 3 logons via network connection from the same account to multiple hosts in a short period.
  severity_baseline: medium
  description: Signals potential use of stolen credentials for lateral movement.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: event-4672-special-privileges-assigned
  pattern: Special privileges assigned to a privileged user account within a short period.
  severity_baseline: medium
  description: Indicates suspicious admin activity that could be part of privilege escalation.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: event-4662-dcsync-attack
  pattern: DCSync attack with Event ID 4662.
  severity_baseline: high
  description: Detects an attempt to abuse replication rights for privilege escalation.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: event-4768-kerberos-tgt
  pattern: Kerberos Ticket-Granting Ticket with Event ID 4768.
  severity_baseline: high
  description: Indicates a potential Golden Ticket attack.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: event-4720-new-user-account
  pattern: New user account creation with Event ID 4720.
  severity_baseline: medium
  description: Detects potential persistence mechanisms by attackers.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: event-4656-lsass-credential-dumping
  pattern: Credential dumping with Event ID 4656 on LSASS.
  severity_baseline: high
  description: Indicates a potential lateral movement tool like Mimikatz is in use.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/soc-playbook-lateral-movement-detection-and-response-guide/
source_title: What is Lateral Movement? | CyberDefenders Blog
