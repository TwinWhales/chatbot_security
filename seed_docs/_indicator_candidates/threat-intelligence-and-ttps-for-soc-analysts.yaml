topic: Behavioral Detection for SOC Analysts
indicators:
- id: powershell-suspicious-flags
  pattern: EventID=4688 AND ProcessName="powershell.exe" AND CommandLine CONTAINS (-enc OR -nop OR -w hidden)
  severity_baseline: low
  description: Detects PowerShell execution with suspicious command-line flags.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: unusual-process-chain
  pattern: ProcessCreation AND ProcessName="wordpad.exe" AND CommandLine CONTAINS "powershell"
  severity_baseline: low
  description: Detects unusual process chains involving WordPad and PowerShell.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: lateral-movement-anomaly
  pattern: NetworkConnection AND SourcePort=445 AND DestinationIP NOT IN KnownInternalIPs
  severity_baseline: medium
  description: Detects lateral movement outside of normal patterns.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: living-off-the-land-binaries
  pattern: ProcessCreation AND ProcessName IN KnownLOLBins
  severity_baseline: low
  description: Detects the use of living-off-the-land binaries.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: credential-dumping-attempt
  pattern: ProcessCreation AND ProcessName="lsass.exe" AND CommandLine CONTAINS "mimikatz"
  severity_baseline: medium
  description: Detects attempts to dump credentials using Mimikatz.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: privilege-escalation-attempt
  pattern: ProcessCreation AND ProcessName="psexec.exe"
  severity_baseline: medium
  description: Detects attempts to escalate privileges using psexec.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: unusual-registry-access
  pattern: RegistryKeyAccess AND KeyPath CONTAINS "\SystemRoot\system32\config"
  severity_baseline: low
  description: Detects unusual access to system registry keys.
  tool_hint: regripper (registry)
  applicable_evidence_types:
  - memory_dump
  - registry_hive
- id: suspicious-scheduled-task
  pattern: ScheduledTask AND CommandLine CONTAINS "powershell"
  severity_baseline: low
  description: Detects suspicious scheduled tasks involving PowerShell.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/threat-intelligence-and-ttps-for-soc-analysts/
source_title: What is Behavioral detection for SOC analysts?
