topic: Detection Logic and Engineering for SOC Analysts
indicators:
- id: powershell_suspicious_args
  pattern: PowerShell command-line arguments containing base64-encoded data or known malicious patterns
  severity_baseline: medium
  description: Detects potentially malicious PowerShell activity
  tool_hint: yara
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: lateral_movement_smb
  pattern: User authentication to multiple hosts via SMB within a short timeframe
  severity_baseline: low
  description: Identifies suspicious lateral movement activity
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: failed_logon_spam
  pattern: More than five failed logons from the same IP within 10 minutes
  severity_baseline: low
  description: Detects potential brute force attack attempts
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: malware_signature_match
  pattern: File hash or signature matching known malicious files in the organization's threat intelligence database
  severity_baseline: high
  description: Identifies presence of known malware
  tool_hint: yara (signatures)
  applicable_evidence_types:
  - memory_dump
  - disk_image
- id: privilege_escalation_attempts
  pattern: Commands or scripts attempting to elevate privileges, such as 'runas' or 'net user'
  severity_baseline: medium
  description: Detects potential privilege escalation attempts
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: unusual_network_traffic
  pattern: Network traffic patterns deviating from baseline, such as unusual outbound connections or large data transfers
  severity_baseline: low
  description: Identifies potential exfiltration or command and control activity
  tool_hint: tshark (pcap)
  applicable_evidence_types:
  - pcap
- id: suspicious_email_content
  pattern: Email content containing suspicious URLs, attachments, or obfuscated text
  severity_baseline: low
  description: Detects potential phishing attempts
  tool_hint: yara (signatures)
  applicable_evidence_types:
  - email
- id: registry_hive_modification
  pattern: Modification of critical registry keys, such as those related to system services or startup programs
  severity_baseline: medium
  description: Identifies potential persistence mechanisms used by malware
  tool_hint: regripper (registry)
  applicable_evidence_types:
  - registry_hive
source_url: https://cyberdefenders.org/blog/detection-engineering-vs-detection-logic/
source_title: What is Detection Engineering? | CyberDefenders Blog
