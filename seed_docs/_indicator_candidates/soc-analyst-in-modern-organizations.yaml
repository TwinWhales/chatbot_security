topic: Role of SOC Analysts in Modern Organizations
indicators:
- id: compliance_gdpr_monitoring
  pattern: Unauthorized access to personal data within monitored systems.
  severity_baseline: medium
  description: Detects potential GDPR violations by monitoring for unauthorized data access.
  tool_hint: plaso (timeline)
  applicable_evidence_types:
  - registry_hive
  - memory_dump
- id: compliance_hipaa_audit_logs
  pattern: Unusual healthcare record queries outside normal business hours.
  severity_baseline: medium
  description: Identifies potential HIPAA violations by monitoring audit logs for suspicious access patterns.
  tool_hint: regripper (registry)
  applicable_evidence_types:
  - registry_hive
- id: compliance_pci_dss_cardholder_data
  pattern: Anomalous activity in cardholder data environments.
  severity_baseline: medium
  description: Detects potential PCI DSS violations by monitoring for unusual activities in payment systems.
  tool_hint: evtx (events)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
- id: compliance_sox_financial_reporting
  pattern: Unauthorized changes to financial reporting systems.
  severity_baseline: medium
  description: Monitors for potential SOX violations by detecting unauthorized modifications in financial systems.
  tool_hint: plaso (timeline)
  applicable_evidence_types:
  - memory_dump
  - evtx_log
source_url: https://cyberdefenders.org/blog/soc-analyst-in-modern-organizations/
source_title: SOC analysts role in modern organizations
